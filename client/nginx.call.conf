# ============================================================
#  Шаблон: __CALL_DOMAIN__ подставляется на сервере (scripts/render-call-nginx.sh).
#  Домены звонков (ru1/ru2/eu1.kintoapp.xyz): DNS-записи БЕЗ Cloudflare — напрямую на сервер,
#  чтобы работал UDP. Здесь только TLS и проксирование:
#    /            -> LiveKit (WebSocket-сигналинг, wss)
#    /kmesh-bridge/ -> kMesh audio gateway (внутренний API Hub; защищён секретом)
#  Сертификат — Let's Encrypt для ЭТОГО домена: /etc/letsencrypt/live/<domain>/
# ============================================================
server {
    listen 443 ssl;
    server_name __CALL_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__CALL_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CALL_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /kmesh-bridge/ {
        set $bridge http://kmesh-audio:8095;
        rewrite ^/kmesh-bridge/(.*)$ /$1 break;
        proxy_pass $bridge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    location / {
        set $lk http://livekit:7880;
        proxy_pass $lk;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
