name: Web client

# Публичный репозиторий: только проверка сборки веба, БЕЗ публикации релиза.
# Серверы берут веб-бандл из приватного репозитория (update-server.sh).
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/web-build.yml'
  pull_request:
    paths:
      - 'client/**'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web bundle (check only)
        working-directory: client
        run: |
          npm ci
          npm run build:web
